server {
    # Listen only on HTTPS (Strict project requirement)
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aelkadir.42.fr;

    # SSL Certificates (we will generate these in the Dockerfile)
    ssl_certificate /etc/ssl/certs/inception.crt;
    ssl_certificate_key /etc/ssl/private/inception.key;

    # Enforce secure protocols (Strict project requirement)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Where to look for the files and what file to load first
    root /var/www/html;
    index index.php index.html index.htm;

    # If someone asks for a URL, try to find the file. If not found, hand it to WordPress.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # The magic bridge: If the file ends in .php, send it to the WordPress container!
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # 'wordpress' is the exact name of the service in docker-compose.yml
        fastcgi_pass wordpress:9000;
    }
}